<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Navbar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <span class="logo-icon">N</span>
            <h2>NEXORA</h2>
        </div>

        <ul class="nav-links">
            <li><a href="#" class="active">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

        <div class="nav-right">
            <i class="fa-solid fa-magnifying-glass search"></i>
            <a href="#" class="login">Login</a>
            <a href="#" class="signup">Get Started <i class="fa-solid fa-arrow-right"></i></a>
        </div>

    </nav>

    <section class="hero">
        <div class="hero-content">
            <span class="tag">WELCOME TO NEXORA</span>
            <h1>Build Your Future<br>With <span>Creative Ideas.</span></h1>
            <p>Discover modern solutions, creative designs and powerful digital experiences.</p>
            <a href="#" class="hero-btn">Explore More <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </section>

</body>

</html>
